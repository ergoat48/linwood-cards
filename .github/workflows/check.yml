name: check and deploy
# Every push and PR: syntax + secret scan, gitleaks over history, build the bundle, smoke-test the bundle.
# Push to main that passes: the bundle is published as a GitHub Release (v2.<run>.0) and Home Assistant is told to
# install it through HACS (webhook in the HA_DEPLOY_WEBHOOK secret). Dashboards load it from the Pi on their next refresh.
# Roll back: Actions › "check and deploy" › Run workflow, give an older commit SHA. That commit is rebuilt and shipped as
# a new, higher version, so HACS always moves forward.
on:
  push:
    branches: ['**', '!deployed']
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (blank = current main). Use an older SHA to roll back.
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOYING: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false   # this job never pushes; keep the token off disk while npm runs
      - name: Switch to the requested commit (manual deploy / rollback)
        if: inputs.sha != ''
        env:
          SHA: ${{ inputs.sha }}
        run: git checkout --detach "$SHA"   # short or full SHA
      - name: Version
        id: v
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "$DEPLOYING" = "true" ]; then V="v2.${{ github.run_number }}.0"; else V="dev-${SHA:0:7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
      - name: Syntax + secret patterns
        run: bash tools/check.sh
      - name: Gitleaks (full history)
        run: |
          curl -sSLf -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --verbose
      - name: Build the bundle
        env:
          LINWOOD_VERSION: ${{ steps.v.outputs.version }}
          GITHUB_SHA: ${{ steps.v.outputs.sha }}
        run: |
          npm ci --no-audit --no-fund
          node tools/build.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (load the bundle, every card must register)
        run: node tools/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bundle
          path: dist/linwood-cards.js
          retention-days: 7

  deploy:
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The HA_DEPLOY_WEBHOOK secret lives in this environment, which only main can deploy to,
    # so a workflow edited on any other branch can't read it.
    environment: production
    permissions:
      contents: write   # only to push the release tag and create the release
    steps:
      # HACS can't download GitHub release assets (github.com's redirect sends a header too large for HA's HTTP client),
      # so the bundle goes into the tagged commit instead: the tag points at a one-off commit = the source commit plus
      # dist/linwood-cards.js. HACS reads dist/ at the tag from raw.githubusercontent.com. No branch ever gets the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: bundle
          path: dist
      - name: Tag the build and publish the release HACS installs
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
          ROLLBACK: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          MSG=$(git log -1 --format=%s "$SHA")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/linwood-cards.js
          git commit -q -m "Build $V from ${SHA:0:7}"
          git tag "$V" && git push -q origin "refs/tags/$V"
          NOTES="${MSG}"$'\n\n'"Built from ${SHA:0:7}."
          [ -n "$ROLLBACK" ] && NOTES="Manual deploy / rollback to ${SHA:0:7}: ${MSG}"
          gh release create "$V" -R "$GITHUB_REPOSITORY" --verify-tag --title "$V — ${MSG}" --notes "$NOTES" --latest
          echo "Released $V (${SHA:0:7})" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tell Home Assistant to install it
        env:
          V: ${{ needs.check.outputs.version }}
          HOOK: ${{ secrets.HA_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo "::warning title=not installed::HA_DEPLOY_WEBHOOK secret is not set — install $V from HACS by hand."; exit 0
          fi
          # The URL is a secret (it's what lets this job reach the house) — never echo it.
          for i in 1 2 3; do
            if curl -fsS -o /dev/null -m 20 -X POST -H 'Content-Type: application/json' -d "{\"version\":\"$V\"}" "$HOOK"; then
              echo "Home Assistant is installing $V — dashboards pick it up on their next refresh." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 10
          done
          echo "::error title=Home Assistant unreachable::Release $V is published, but HA didn't answer. HACS will offer it as an update."; exit 1
