name: check and deploy
# Every push and PR: syntax + secret scan, gitleaks over history, and a smoke test that loads every card.
# Push to main that passes: the commit is written to DEPLOYED on the `deployed` branch. Home Assistant's Linwood Loader
# reads that file, so dashboards pick the change up on their next load (within ~2 minutes).
# Roll back: Actions › "check and deploy" › Run workflow, give a commit SHA (blank = current main).
on:
  push:
    branches: ['**', '!deployed']
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (blank = current main). Use an older SHA to roll back.
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch to the requested commit (manual deploy / rollback)
        if: inputs.sha != ''
        env:
          SHA: ${{ inputs.sha }}
        run: git checkout --detach "$SHA"   # short or full SHA
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax + secret patterns
        run: bash tools/check.sh
      - name: Gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose
      - name: Smoke test (load every card)
        run: |
          if [ ! -f tools/smoke.mjs ]; then echo "No smoke test in this commit (pre-pipeline) — skipped"; exit 0; fi
          npm ci --no-audit --no-fund
          node tools/smoke.mjs

  deploy:
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to move the `deployed` branch; nothing else in this job can write
    steps:
      # The `deployed` branch is a deploy log: each deploy (or rollback) adds a commit that writes the target SHA into
      # DEPLOYED. It only ever moves forward, so CI never needs permission to rewind a branch.
      - name: Record the deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          exec 3>&1
          api() { local out; out=$(gh api "$@" 2>&1) || { echo "::error title=deploy failed::${out//$'\n'/ }" >&3; exit 1; }; printf '%s' "$out"; }
          R="repos/${GITHUB_REPOSITORY}"
          SHA=$(api "$R/commits/${SHA}" --jq .sha)
          if ! gh api "$R/git/ref/heads/deployed" >/dev/null 2>&1; then
            api -X POST "$R/git/refs" -f ref=refs/heads/deployed -f sha="${GITHUB_SHA}" >/dev/null
          fi
          CUR=$(gh api "$R/contents/DEPLOYED?ref=deployed" 2>/dev/null || true)
          CUR_SHA=$(printf '%s' "$CUR" | jq -r '.sha // empty' 2>/dev/null || true)
          CUR_VAL=$(printf '%s' "$CUR" | jq -r '.content // empty' 2>/dev/null | base64 -d 2>/dev/null | tr -d '[:space:]' || true)
          if [ "$CUR_VAL" = "$SHA" ]; then echo "${SHA:0:7} is already deployed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          args=(-X PUT "$R/contents/DEPLOYED" -f branch=deployed -f message="Deploy ${SHA:0:7}${CUR_VAL:+ (was ${CUR_VAL:0:7})}" -f content="$(printf '%s\n' "$SHA" | base64 -w0)")
          [ -n "$CUR_SHA" ] && args+=(-f sha="$CUR_SHA")
          api "${args[@]}" >/dev/null
          echo "Deployed ${SHA:0:7} — dashboards load it on their next refresh." | tee -a "$GITHUB_STEP_SUMMARY"
